<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo_da_pagina }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Taria</h1>

    <form method="POST">
        <input type="text" id="tituloTarefa" name="tituloTarefa">
        <input type="date" id="dataConclusao" name="dataConclusao">
        <button type="submit">Adicionar</button>
    </form>
    <!-- <output id="listaTarefas">Nenhuma tarefa cadastrada</output> -->

    <!-- Lista de tarefas -->
    <ul id="listaTarefas">
        {% for tarefa in tarefas_da_pagina %}
            <li>
                {% if tarefa_em_edicao and tarefa_em_edicao.id_tarefa == tarefa.id_tarefa %}
                    <!-- Modo de edição apenas para a tarefa clicada -->
                    <form method="POST" action="{{ url_for('atualizar', id=tarefa.id_tarefa) }}" style="display: inline;">
                        <input 
                            type="text" 
                            name="tituloTarefa" 
                            value="{{ tarefa.titulo_tarefa }}" 
                            required
                        >
                        <input 
                            type="date" 
                            name="dataConclusao" 
                            value="{{ tarefa.data_conclusao if tarefa.data_conclusao else '' }}"
                        >
                        <button type="submit">Salvar</button>
                        <a href="{{ url_for('home') }}">Cancelar</a>
                    </form>
                {% else %}
                    <!-- Exibição normal das demais tarefas -->
                    {{ tarefa.titulo_tarefa }} - {{ tarefa.data_conclusao }}
                    <a href="{{ url_for('apagar_id_especifico', id=tarefa.id_tarefa) }}">Apagar</a>
                    <a href="{{ url_for('atualizar', id=tarefa.id_tarefa) }}">Editar</a>
                {% endif %}
            </li>
        {% endfor %}
    </ul>
